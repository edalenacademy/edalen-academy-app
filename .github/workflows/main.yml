
name: Build Edalen Academy for Google Play (AAB)

# Run this by hand: Actions tab > "Build Edalen Academy for Google Play (AAB)" > Run workflow.
# It makes the signed .aab file you upload to Google Play Console.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Restore upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build signed AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle bundleRelease -PplayBuild=true -PversionCodeOverride=${{ github.run_number }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: edalen-academy-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
