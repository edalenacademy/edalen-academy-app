
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.edalenacademy.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.edalenacademy.app'
        minSdk 23
        targetSdk 36
        /* The Play workflow passes the run number so every upload has a higher version code. */
        versionCode (project.findProperty('versionCodeOverride') ?: '1').toInteger()
        versionName '1.0'
        /* true only for the Google Play build (workflow passes -PplayBuild=true). */
        buildConfigField 'boolean', 'PLAY_BUILD', project.hasProperty('playBuild') ? 'true' : 'false'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                storeFile file(System.getenv('KEYSTORE_PATH'))
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
